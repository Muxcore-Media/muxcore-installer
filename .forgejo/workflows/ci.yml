name: CI
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  GOPRIVATE: github.com/Muxcore-Media/*
  GOPROXY: https://proxy.golang.org,direct

jobs:
  test:
    runs-on: native
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
      - name: Install Go
        run: |
          set -euo pipefail
          ver=1.26.5
          mkdir -p "$HOME/.local"
          if [ ! -x "$HOME/.local/go/bin/go" ] || ! "$HOME/.local/go/bin/go" version | grep -q "$ver"; then
            curl -fsSL "https://go.dev/dl/go${ver}.linux-amd64.tar.gz" | tar -C "$HOME/.local" -xz
          fi
          echo "$HOME/.local/go/bin" >> "$GITHUB_PATH"
      - name: Fetch MuxCore modules from Forgejo origin
        run: |
          git config --global url."https://git.zem.systems/muxcore/".insteadOf "https://github.com/Muxcore-Media/"
      - name: go test / vet / gofmt
        run: |
          set -euo pipefail
          go test -count=1 -timeout 10m ./...
          go vet ./...
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            echo "gofmt needs to be run on:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
      - name: shellcheck embedded scripts
        run: |
          set -euo pipefail
          scripts=(get-onboard.sh up.sh bootstrap-auth.sh smoke-fixture.sh lib/common.sh lib/modules.sh)
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck -x "${scripts[@]}"
          else
            for s in "${scripts[@]}"; do bash -n "$s"; done
          fi
      - name: non-interactive dry-run
        run: |
          set -euo pipefail
          go build -o /tmp/muxcore-setup ./cmd/muxcore-setup
          rm -rf "$RUNNER_TEMP/muxcore-dry-run" && mkdir -p "$RUNNER_TEMP/muxcore-dry-run"
          cd "$RUNNER_TEMP/muxcore-dry-run"
          MUXCORE_I_AGREE=1 MUXCORE_NONINTERACTIVE=1 MUXCORE_DRY_RUN=1 /tmp/muxcore-setup
