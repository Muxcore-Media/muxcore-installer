# call-policy-default — inter-module call policy
#
# Rules are evaluated in order. The first matching rule decides.
# Wildcard "*" matches any caller, target, or method.
#
# Laptop / installer demo: the catch-all at the bottom is ENABLED so the
# fixture mesh works without hand-editing YAML. For production, comment it
# out and keep least-privilege rules only.
#
# Installer: muxcore-installer ships copies under policies/call-policy.yaml
# and sets CALL_POLICY_FILE to that path (do not rely on process cwd).

# Allow downloader to read/write storage
- caller: "downloader-qbittorrent"
  target: "storage-local"
  methods: ["Put", "Get", "Stat", "Delete"]

- caller: "downloader-native-torrent"
  target: "storage"
  methods: ["read", "write", "Put", "Get", "Stat", "Delete"]

# Allow scanner to write to storage (imports downloaded files)
- caller: "media-scanner"
  target: "storage"
  methods: ["write", "read"]

# Allow scanner as _public caller to access storage
- caller: "_public"
  target: "storage"
  methods: ["read", "write"]

# Allow transcoder to read and stream from storage
- caller: "transcoder-ffmpeg"
  target: "storage-local"
  methods: ["Get", "Stream", "Stat"]

# Allow media managers to query each other
- caller: "media-movies"
  target: "media-tvshows"
  methods: ["Search", "Lookup", "*"]
- caller: "media-tvshows"
  target: "media-movies"
  methods: ["Search", "Lookup", "*"]

# Automation ↔ acquisition / library
- caller: "media-automation"
  target: "*"
  methods: ["*"]

# Allow media-jellyfin / jellyfin to stream from storage
- caller: "media-jellyfin"
  target: "storage"
  methods: ["read", "write"]
- caller: "jellyfin"
  target: "storage"
  methods: ["read", "write"]

# Allow any authenticated module to check auth status
- caller: "*"
  target: "auth-local"
  methods: ["Validate", "*"]

# Dev-mode: allow unauthenticated callers (from modules without auth) to
# access storage. In production, deploy an auth module (e.g. auth-local)
# which properly resolves caller identities.
- caller: "_public"
  target: "storage"
  methods: ["read", "write"]

# Laptop / installer demo catch-all — leave enabled for fixture mesh.
# Comment out for production least-privilege deployments.
- caller: "*"
  target: "*"
  methods: ["*"]
