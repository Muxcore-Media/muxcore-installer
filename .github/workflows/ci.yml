name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions: read-all

jobs:
  build:
    name: Build, vet, dry-run
    runs-on: self-hosted
    steps:
      - name: Clean runner workspace
        run: rm -rf "${GITHUB_WORKSPACE}/"* "${RUNNER_TEMP}/"* 2>/dev/null; true
      - uses: Muxcore-Media/mvp/.github/actions/checkout-mirror@main
        with:
          token: ${{ secrets.MUXCORE_CI_TOKEN || github.token }}
      - name: go build / vet / gofmt
        run: |
          set -euo pipefail
          go build ./...
          go vet ./...
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            echo "gofmt needs to be run on:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
      - name: shellcheck embedded scripts
        run: |
          set -euo pipefail
          scripts=(get-onboard.sh up.sh bootstrap-auth.sh smoke-fixture.sh lib/common.sh lib/modules.sh)
          if command -v shellcheck >/dev/null 2>&1; then
            echo "==> shellcheck ${scripts[*]}"
            shellcheck -x "${scripts[@]}"
          else
            echo "==> shellcheck not installed; bash -n fallback"
            for s in "${scripts[@]}"; do
              echo "bash -n $s"
              bash -n "$s"
            done
          fi
      - name: non-interactive dry-run
        run: |
          set -euo pipefail
          go build -o /tmp/muxcore-setup ./cmd/muxcore-setup
          rm -rf "$RUNNER_TEMP/muxcore-dry-run" && mkdir -p "$RUNNER_TEMP/muxcore-dry-run"
          cd "$RUNNER_TEMP/muxcore-dry-run"
          MUXCORE_I_AGREE=1 MUXCORE_NONINTERACTIVE=1 MUXCORE_DRY_RUN=1 /tmp/muxcore-setup
